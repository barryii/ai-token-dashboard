services:
  - type: web
    name: ai-token-dashboard
    env: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4173
      - key: INGEST_TOKEN
        generateValue: true
      # 雲端主機預設 UTC。取消註解並改成你的時區，熱力圖/價格鎖定按本地時間顯示。
      # - key: DISPLAY_TZ
      #   value: Asia/Shanghai
    disk:
      name: ai-token-dashboard-data
      mountPath: /app/data
      sizeGB: 1
